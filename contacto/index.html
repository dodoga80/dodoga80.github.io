<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domingo Garay | Contacto</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background-color: #f4f6f8;
    color: #333;
}

header {
    background-color: #1f3a56;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin-bottom: 10px;
    font-size: 32px;
}

section {
    max-width: 1000px;
    margin: 40px auto 120px auto;
    padding: 0 20px;
}

.card-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 25px;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    text-align: center;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    text-decoration: none;
    color: inherit;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.card-emoji {
    font-size: 48px;
    margin-bottom: 10px;
}

.card h3 {
    color: #1f3a56;
    margin: 10px 0;
    font-size: 18px;
    font-weight: bold;
}

/* SECCIÓN FORMULARIO */
.contenido-seccion {
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    margin-top: 20px;
    display: none;
    scroll-margin-top: 20px;
    text-align: justify;
}

.contenido-seccion.activo {
    display: block;
}

.contenido-seccion h2 {
    color: #1f3a56;
    font-size: 1.5em;
    margin-top: 0;
    margin-bottom: 20px;
    border-bottom: 2px solid #1f3a56;
    padding-bottom: 10px;
}

/* FORMULARIO */
form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

input, textarea {
    padding: 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
    font-size: 14px;
}

textarea {
    resize: vertical;
    min-height: 120px;
}

form button {
    background-color: #1f3a56;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
}

form button:hover {
    background-color: #143048;
}

/* BOTÓN FIJO GLOBAL */
.boton-principal-wrapper {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    z-index: 1000;
    display: flex;
    justify-content: center;
    pointer-events: none;
}

.boton-principal-inner {
    width: 100%;
    max-width: 1000px;
    padding: 0 20px;
    display: flex;
    justify-content: flex-start;
    pointer-events: none;
}

.boton-principal {
    pointer-events: all;
    padding: 10px 22px;
    background-color: #1f3a56;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: background-color 0.2s;
    min-width: 120px;
    width: 120px;
    text-align: center;
    white-space: nowrap;
    position: relative;
    z-index: 1001;
}

.boton-principal:hover {
    background-color: #2a4a6e;
}

html {
    scroll-behavior: smooth;
}
</style>
</head>

<body>

<header>
    <h1>Contacto</h1>
</header>

<section>

<div class="card-container" id="directorio">

    <!-- Email (DIRECTO) -->
    <a class="card" href="mailto:dodogaray@gmail.com">
        <div class="card-emoji">📧</div>
        <h3>Correo electrónico</h3>
    </a>

    <!-- WhatsApp (DIRECTO) -->
    <a class="card" target="_blank" href="https://wa.me/543804529915">
        <div class="card-emoji">💬</div>
        <h3>Chat de WhatsApp</h3>
    </a>

    <!-- Formulario (DESPLEGABLE) -->
    <div class="card" id="card-formulario" onclick="mostrarSeccion('formulario')">
        <div class="card-emoji">📋</div>
        <h3>Formulario de contacto</h3>
    </div>

</div>

<!-- Formulario de contacto -->
<div id="formulario" class="contenido-seccion">
    <h2>Formulario de contacto</h2>
    <form onsubmit="enviarFormulario(event)">
        <input type="text" id="nombre" placeholder="Nombre" required>
        <input type="text" id="apellido" placeholder="Apellido" required>
        <input type="tel" id="telefono" placeholder="Teléfono">
        <input type="email" id="emailform" placeholder="Email" required>
        <textarea id="mensaje" placeholder="Mensaje" required></textarea>
        <button type="submit">Enviar</button>
    </form>
</div>

</section>

<!-- BOTÓN ÚNICO DINÁMICO -->
<div class="boton-principal-wrapper">
    <div class="boton-principal-inner">
        <button id="botonPrincipal" class="boton-principal" onclick="accionBoton()">← Inicio</button>
    </div>
</div>

<script>

let seccionActiva = null;

function mostrarSeccion(id) {

    document.getElementById("directorio").style.display = "none";

    document.getElementById('formulario').classList.remove('activo');
    document.getElementById('card-formulario').classList.remove('activo');

    const seccion = document.getElementById(id);
    seccion.classList.add('activo');
    document.getElementById('card-' + id).classList.add('activo');

    seccionActiva = id;

    const btn = document.getElementById("botonPrincipal");
    btn.innerText = "← Volver";
    btn.style.display = "block";

    setTimeout(function() {
        seccion.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
}

function volver() {

    document.getElementById('formulario').classList.remove('activo');
    document.getElementById('card-formulario').classList.remove('activo');

    document.getElementById("directorio").style.display = "grid";

    seccionActiva = null;

    const btn = document.getElementById("botonPrincipal");
    btn.innerText = "← Inicio";
    btn.style.display = "block";

    document.querySelector('.card-container')
        .scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function accionBoton() {
    if (seccionActiva) {
        volver();
    } else {
        window.location.assign("https://dodoga80.github.io/");
    }
}

function enviarFormulario(e) {
    e.preventDefault();

    let nombre = document.getElementById("nombre").value;
    let apellido = document.getElementById("apellido").value;
    let telefono = document.getElementById("telefono").value;
    let email = document.getElementById("emailform").value;
    let mensaje = document.getElementById("mensaje").value;

    let asunto = "Consulta desde sitio web";
    let cuerpo =
        "Nombre: " + nombre + "%0D%0A" +
        "Apellido: " + apellido + "%0D%0A" +
        "Teléfono: " + telefono + "%0D%0A" +
        "Email: " + email + "%0D%0A%0D%0A" +
        "Mensaje:%0D%0A" + mensaje;

    window.location.href =
        "mailto:dodogaray@gmail.com?subject=" + asunto + "&body=" + cuerpo;
}

window.onload = function() {
    const btn = document.getElementById("botonPrincipal");
    btn.innerText = "← Inicio";
    btn.style.display = "block";
};

</script>

</body>
</html>
