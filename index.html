<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domingo GARAY</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=JetBrains+Mono:wght@600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --forest-dark: #1a2e1a;
  --sage-dark: #5a7d5a;
  --cream-warm: #f5f1e8;
  --cream-light: #fbf9f4;
  --white-pure: #ffffff;
  --accent-bronze: #8b7355;
  --border-cards: #1f3a56;
}
html { scroll-behavior: smooth; }
body {
  font-family: 'Quicksand', sans-serif;
  background: linear-gradient(135deg, var(--cream-warm) 0%, var(--cream-light) 100%);
  color: #0f1810;
  min-height: 100vh;
  overflow-x: hidden;
}
.page {
  max-width: 1000px;
  margin: 0 auto;
  padding: clamp(20px, 3vw, 44px) clamp(24px, 6vw, 60px);
  display: flex;
  flex-direction: column;
  gap: clamp(32px, 6vw, 40px);
}
header {
  display: flex;
  flex-direction: column;
  gap: clamp(12px, 2vw, 16px);
  padding-bottom: clamp(24px, 3.5vw, 32px);
  border-bottom: 2px solid var(--border-cards);
}
.header-mark { text-align: center; }
.mark-text {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--accent-bronze);
}
.site-title {
  font-family: 'Bodoni Moda', serif;
  font-size: clamp(1.8rem, 9.5vw, 5.2rem);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.03em;
  color: var(--forest-dark);
  text-align: center;
  white-space: nowrap;
  overflow: visible;
  text-overflow: clip;
}

.site-title em {
  font-style: normal;
  color: var(--forest-dark);
}
.site-subtitle {
  font-size: clamp(0.92rem, 2.1vw, 0.98rem);
  line-height: 1.5;
  color: var(--sage-dark);
  text-align: center;
  max-width: 100%;
  margin: 0 auto;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dirs-section { display: flex; flex-direction: column; gap: clamp(8px, 1.5vw, 14px); }
.repo-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: clamp(12px, 1.6vw, 16px);
}
.repo-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: clamp(14px, 1.8vw, 22px) clamp(8px, 1.3vw, 12px);
  background: var(--white-pure);
  border: 1.5px solid var(--border-cards);
  border-radius: 20px;
  text-decoration: none;
  color: #0f1810;
  cursor: pointer;
  text-align: center;
  min-height: 100px;
  position: relative;
  transition: all 0.4s;
  box-shadow: 0 1px 3px rgba(15, 24, 16, 0.12);
}
.repo-card::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: var(--border-cards);
  transform: scaleX(0);
  transition: transform 0.5s;
}
.repo-card:hover {
  transform: translateY(-8px) scale(1.02);
  box-shadow: 0 12px 32px rgba(15, 24, 16, 0.18);
}
.repo-card:hover::after { transform: scaleX(1); }
.repo-icon {
  font-size: clamp(1.8rem, 4.5vw, 2.6rem);
  transition: all 0.4s;
}
.repo-card:hover .repo-icon { transform: scale(1.2); }
.repo-name {
  font-size: clamp(0.75rem, 1.6vw, 0.92rem);
  font-weight: 600;
  color: var(--forest-dark);
  transition: color 0.4s;
}
.repo-card:hover .repo-name { color: var(--border-cards); }
footer {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding-top: clamp(24px, 3.5vw, 32px);
  border-top: 2px solid var(--border-cards);
}
.footer-text {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--accent-bronze);
  opacity: 0.7;
}
@media (max-width: 700px) {
  .site-subtitle { white-space: normal; }
  .repo-grid { grid-template-columns: repeat(3, 1fr); }
  .repo-card { min-height: 110px; padding: 16px 10px; }
}
@media (max-width: 520px) {
  .page { gap: clamp(36px, 6vw, 48px); }
  .site-subtitle { font-size: clamp(0.88rem, 2vw, 1.05rem); line-height: 1.5; }
  .repo-card { min-height: 100px; padding: 14px 8px; }
}
</style>
</head>
<body>
<main class="page">
  <header>
    <div class="header-mark">
      <span class="mark-text">dodoga80.github.io</span>
    </div>
    <h1 class="site-title">Domingo <em>GARAY</em></h1>
    <p class="site-subtitle">Servicio técnico profesional de generación de información ambiental para gestión territorial</p>
  </header>

  <section class="dirs-section">
    <div class="repo-grid">
      <a href="/perfil/" class="repo-card">
        <span class="repo-icon">👤</span>
        <span class="repo-name">Perfil</span>
      </a>
      <a href="/servicios/" class="repo-card">
        <span class="repo-icon">🧰</span>
        <span class="repo-name">Servicios</span>
      </a>
      <a href="/publicaciones/" class="repo-card">
        <span class="repo-icon">✍️</span>
        <span class="repo-name">Publicaciones</span>
      </a>
      <a href="/proyectos/" class="repo-card">
        <span class="repo-icon">👨‍🏫</span>
        <span class="repo-name">Proyectos</span>
      </a>
      <a href="/precipitaciones/" class="repo-card">
        <span class="repo-icon">🌧️</span>
        <span class="repo-name">Precipitaciones</span>
      </a>
      <a href="/incendios/" class="repo-card">
        <span class="repo-icon">🔥</span>
        <span class="repo-name">Incendios</span>
      </a>
      <a href="/transferencia/" class="repo-card">
        <span class="repo-icon">🔗</span>
        <span class="repo-name">Transferencia</span>
      </a>
      <a href="/varios/" class="repo-card">
        <span class="repo-icon">📂</span>
        <span class="repo-name">Varios</span>
      </a>
      <a href="/contacto/" class="repo-card">
        <span class="repo-icon">📱</span>
        <span class="repo-name">Contacto</span>
      </a>
    </div>
  </section>

  <footer>
    <p class="footer-text">© Domingo Garay • 2026</p>
    <p class="footer-text">Versión 1.0</p>
  </footer>
</main>
</body>
</html>
