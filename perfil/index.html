<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domingo Garay | Perfil Profesional</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background-color: #f4f6f8;
    color: #333;
}

/* HEADER */
header {
    background-color: #1f3a56;
    color: white;
    padding: 25px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

/* CONTENEDOR */
section {
    max-width: 1000px;
    margin: 20px auto 80px auto;
    padding: 0 20px;
}

/* BOTÓN FIJO INFERIOR IZQUIERDO */
.boton-principal {
    position: fixed;
    bottom: 20px;
    left: 20px;
    padding: 10px 20px;
    background-color: #1f3a56;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: 0.2s;
    z-index: 1000;
}

.boton-principal:hover {
    background-color: #2a4a6e;
}

/* TARJETAS */
.card-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    text-align: center;
    cursor: pointer;
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-4px);
}

.card-emoji {
    font-size: 42px;
    margin-bottom: 8px;
}

.card h3 {
    font-size: 16px;
    margin: 0;
}

/* SECCIONES */
.contenido-seccion {
    display: none;
    margin-top: 20px;
}

.contenido-seccion.activo {
    display: block;
}

.contenido-seccion h2 {
    font-size: 20px;
    color: #1f3a56;
    margin-bottom: 15px;
}

.contenido-seccion p {
    text-align: justify;
    line-height: 1.6;
    margin-bottom: 15px;
}
</style>
</head>

<body>

<header>
    <h1>Mi Perfil</h1>
</header>

<section>

<div class="card-container" id="directorio">
    <div class="card" onclick="mostrarSeccion('perfil')">
        <div class="card-emoji">🙋</div>
        <h3>Acerca de mí</h3>
    </div>

    <div class="card" onclick="mostrarSeccion('formacion')">
        <div class="card-emoji">🎓</div>
        <h3>Formación académica</h3>
    </div>

    <div class="card" onclick="mostrarSeccion('especialidades')">
        <div class="card-emoji">💡</div>
        <h3>Especialidades</h3>
    </div>
</div>

<!-- SECCIONES -->
<div id="perfil" class="contenido-seccion">
    <h2>Acerca de mí</h2>
    <p>Contenido completo aquí...</p>
</div>

<div id="formacion" class="contenido-seccion">
    <h2>Formación académica</h2>
    <p>Contenido completo aquí...</p>
</div>

<div id="especialidades" class="contenido-seccion">
    <h2>Especialidades</h2>
    <p>Contenido completo aquí...</p>
</div>

</section>

<!-- BOTÓN ÚNICO -->
<button id="botonPrincipal" class="boton-principal" onclick="accionBoton()">
    ← Inicio
</button>

<script>

let seccionActiva = null;

function mostrarSeccion(id) {

    document.getElementById("directorio").style.display = "none";

    document.querySelectorAll('.contenido-seccion')
        .forEach(sec => sec.classList.remove('activo'));

    document.getElementById(id).classList.add('activo');

    seccionActiva = id;

    document.getElementById("botonPrincipal").innerText = "← Volver";

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function accionBoton() {

    if (seccionActiva) {

        document.querySelectorAll('.contenido-seccion')
            .forEach(sec => sec.classList.remove('activo'));

        document.getElementById("directorio").style.display = "grid";

        seccionActiva = null;

        document.getElementById("botonPrincipal").innerText = "← Inicio";

        window.scrollTo({ top: 0, behavior: 'smooth' });

    } else {

        window.location.href = "index.html";
    }
}

</script>

</body>
</html>
