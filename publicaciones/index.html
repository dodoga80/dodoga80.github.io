<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domingo Garay | Publicaciones</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background-color: #f4f6f8;
    color: #333;
}

header {
    background-color: #1f3a56;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin-bottom: 10px;
    font-size: 32px;
}

section {
    max-width: 1000px;
    margin: 40px auto 120px auto;
    padding: 0 20px;
}

.card-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 25px;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    text-align: center;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.card.activo {
    background-color: #1f3a56;
    color: white;
}

.card.activo h3,
.card.activo p {
    color: white;
}

.card-emoji {
    font-size: 48px;
    margin-bottom: 10px;
}

.card h3 {
    color: #1f3a56;
    margin: 10px 0;
    font-size: 18px;
    font-weight: bold;
}

.card p {
    font-size: 14px;
    color: #666;
}

/* SECCIONES */
.contenido-seccion {
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    margin-top: 20px;
    display: none;
    scroll-margin-top: 20px;
    text-align: justify;
}

.contenido-seccion.activo {
    display: block;
}

.contenido-seccion h2 {
    color: #1f3a56;
    font-size: 1.5em;
    margin-top: 0;
    margin-bottom: 20px;
    border-bottom: 2px solid #1f3a56;
    padding-bottom: 10px;
}

/* RECUADRO EN CONSTRUCCIÓN */
.mensaje-recuadro {
    text-align: center;
    padding: 50px 20px;
    background-color: white;
    border-radius: 10px;
    margin-bottom: 10px;
    border: 2px dashed #1f3a56;
}

.mensaje-recuadro .emoji-grande {
    font-size: 80px;
    margin-bottom: 25px;
}

.mensaje-recuadro h3 {
    color: #1f3a56;
    font-size: 24px;
    margin: 0;
    font-weight: bold;
}

/* BOTÓN FIJO GLOBAL */
.boton-principal-wrapper {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    z-index: 1000;
    display: flex;
    justify-content: center;
    pointer-events: none;
}

.boton-principal-inner {
    width: 100%;
    max-width: 1000px;
    padding: 0 20px;
    display: flex;
    justify-content: flex-start;
    pointer-events: none;
}

.boton-principal {
    pointer-events: all;
    padding: 10px 22px;
    background-color: #1f3a56;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: background-color 0.2s;
    min-width: 120px;
    width: 120px;
    text-align: center;
    white-space: nowrap;
    position: relative;
    z-index: 1001;
}

.boton-principal:hover {
    background-color: #2a4a6e;
}

html {
    scroll-behavior: smooth;
}
</style>
</head>

<body>

<header>
    <h1>Publicaciones</h1>
</header>

<section>

<div class="card-container" id="directorio">

    <div class="card" id="card-informes" onclick="mostrarSeccion('informes')">
        <div class="card-emoji">📈</div>
        <h3>Informes técnicos</h3>
    </div>

    <div class="card" id="card-revistas" onclick="mostrarSeccion('revistas')">
        <div class="card-emoji">📰</div>
        <h3>Revistas de divulgación</h3>
    </div>

    <div class="card" id="card-congresos" onclick="mostrarSeccion('congresos')">
        <div class="card-emoji">🎙️</div>
        <h3>Congresos y ponencias</h3>
    </div>

</div>

<!-- Informes técnicos -->
<div id="informes" class="contenido-seccion">
    <h2>Informes técnicos</h2>
    <div class="mensaje-recuadro">
        <div class="emoji-grande">🚧</div>
        <h3>Esta sección se encuentra en construcción</h3>
    </div>
</div>

<!-- Revistas de divulgación -->
<div id="revistas" class="contenido-seccion">
    <h2>Revistas de divulgación</h2>
    <div class="mensaje-recuadro">
        <div class="emoji-grande">🚧</div>
        <h3>Esta sección se encuentra en construcción</h3>
    </div>
</div>

<!-- Congresos y ponencias -->
<div id="congresos" class="contenido-seccion">
    <h2>Congresos y ponencias</h2>
    <div class="mensaje-recuadro">
        <div class="emoji-grande">🚧</div>
        <h3>Esta sección se encuentra en construcción</h3>
    </div>
</div>

</section>

<!-- BOTÓN ÚNICO DINÁMICO -->
<div class="boton-principal-wrapper">
    <div class="boton-principal-inner">
        <button id="botonPrincipal" class="boton-principal" onclick="accionBoton()">← Inicio</button>
    </div>
</div>

<script>

let seccionActiva = null;

function mostrarSeccion(id) {

    document.getElementById("directorio").style.display = "none";

    document.getElementById('informes').classList.remove('activo');
    document.getElementById('revistas').classList.remove('activo');
    document.getElementById('congresos').classList.remove('activo');

    document.getElementById('card-informes').classList.remove('activo');
    document.getElementById('card-revistas').classList.remove('activo');
    document.getElementById('card-congresos').classList.remove('activo');

    const seccion = document.getElementById(id);
    seccion.classList.add('activo');

    document.getElementById('card-' + id).classList.add('activo');

    seccionActiva = id;

    const btn = document.getElementById("botonPrincipal");
    btn.innerText = "← Volver";
    btn.style.display = "block";

    setTimeout(function() {
        seccion.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
}

function volver() {

    document.getElementById('informes').classList.remove('activo');
    document.getElementById('revistas').classList.remove('activo');
    document.getElementById('congresos').classList.remove('activo');

    document.getElementById('card-informes').classList.remove('activo');
    document.getElementById('card-revistas').classList.remove('activo');
    document.getElementById('card-congresos').classList.remove('activo');

    document.getElementById("directorio").style.display = "grid";

    seccionActiva = null;

    const btn = document.getElementById("botonPrincipal");
    btn.innerText = "← Inicio";
    btn.style.display = "block";

    document.querySelector('.card-container')
        .scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function accionBoton() {
    if (seccionActiva) {
        volver();
    } else {
        window.location.assign("https://dodoga80.github.io/");
    }
}

window.onload = function() {
    const btn = document.getElementById("botonPrincipal");
    btn.innerText = "← Inicio";
    btn.style.display = "block";
};

</script>

</body>
</html>
