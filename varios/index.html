<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domingo Garay | Varios</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background-color: #f4f6f8;
    color: #333;
}

header {
    background-color: #1f3a56;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin-bottom: 10px;
    font-size: 32px;
}

section {
    max-width: 1000px;
    margin: 40px auto 120px auto;
    padding: 0 20px;
}

.mensaje-recuadro {
    text-align: center;
    padding: 50px 20px;
    background-color: white;
    border-radius: 10px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    border: 2px dashed #1f3a56;
}

.mensaje-recuadro .emoji-grande {
    font-size: 80px;
    margin-bottom: 25px;
}

.mensaje-recuadro h3 {
    color: #1f3a56;
    font-size: 24px;
    margin: 0;
    font-weight: bold;
}

/* BOTÓN FIJO GLOBAL */
.boton-principal-wrapper {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    z-index: 1000;
    display: flex;
    justify-content: center;
    pointer-events: none;
}

.boton-principal-inner {
    width: 100%;
    max-width: 1000px;
    padding: 0 20px;
    display: flex;
    justify-content: flex-start;
    pointer-events: none;
}

.boton-principal {
    pointer-events: all;
    padding: 10px 22px;
    background-color: #1f3a56;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: background-color 0.2s;
    min-width: 120px;
    width: 120px;
    text-align: center;
    white-space: nowrap;
    position: relative;
    z-index: 1001;
}

.boton-principal:hover {
    background-color: #2a4a6e;
}

html {
    scroll-behavior: smooth;
}
</style>
</head>

<body>

<header>
    <h1>Varios</h1>
</header>

<section>
    <div class="mensaje-recuadro">
        <div class="emoji-grande">🚧</div>
        <h3>Este directorio se encuentra en construcción</h3>
    </div>
</section>

<!-- BOTÓN INICIO -->
<div class="boton-principal-wrapper">
    <div class="boton-principal-inner">
        <button class="boton-principal" onclick="window.location.assign('https://dodoga80.github.io/')">← Inicio</button>
    </div>
</div>

</body>
</html>
