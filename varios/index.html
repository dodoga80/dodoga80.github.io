<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domingo Garay | Varios</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background-color: #f4f6f8;
    color: #333;
}

section {
    max-width: 1000px;
    margin: 40px auto;
    padding: 0 20px;
}

/* === CONTENEDOR === */
.seccion-container {
    margin-top: 20px;
}

/* === RECUADRO DE MENSAJE === */
.mensaje-recuadro {
    text-align: center;
    padding: 50px 20px;
    background-color: white;
    border-radius: 10px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    margin-bottom: 25px;
    border: 2px dashed #1f3a56;
}

.mensaje-recuadro .emoji-grande {
    font-size: 80px;
    margin-bottom: 25px;
}

.mensaje-recuadro h3 {
    color: #1f3a56;
    font-size: 24px;
    margin: 0;
    font-weight: bold;
}

/* === BOTÓN VOLVER === */
.volver-btn {
    display: inline-block;
    background-color: #1f3a56;
    color: white;
    border: none;
    padding: 8px 20px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    font-weight: normal;
    transition: background-color 0.2s;
}

.volver-btn:hover {
    background-color: #143048;
}

.volver-btn::before {
    content: "← ";
    font-weight: normal;
}

/* Scroll suave */
html {
    scroll-behavior: smooth;
}
</style>
</head>

<body>

<section>

    <div class="seccion-container">

        <div class="mensaje-recuadro">
            <div class="emoji-grande">🚧</div>
            <h3>Este directorio se encuentra en construcción</h3>
        </div>

        <button class="volver-btn" onclick="volver()">Volver</button>

    </div>

</section>

<script>
function volver() {
    window.history.back();
}
</script>

</body>
</html>
