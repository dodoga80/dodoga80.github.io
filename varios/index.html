<!DOCTYPE html>

<style>

    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* === RECUADRO DE MENSAJE === */
.mensaje-recuadro {

    border: 2px dashed #1f3a56;
    max-width: 600px;
    width: 90%;
}

.mensaje-recuadro .emoji-grande {
    font-size: 80px;
    margin-bottom: 25px;
}

.mensaje-recuadro h3 {
    color: #1f3a56;

    margin: 0;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="mensaje-recuadro">
